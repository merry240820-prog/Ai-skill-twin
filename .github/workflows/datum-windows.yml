name: Datum Windows build

on:
  push:
    paths: ["datum/**", ".github/workflows/datum-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: datum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            datum/requirements.txt
            datum/requirements-windows.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows.txt pytest

      - name: Engine tests
        run: python -m pytest -q tests

      - name: Build Datum.exe (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/datum.spec

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Datum/Datum.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc packaging/datum.iss
          Get-ChildItem packaging/Output

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Datum -DestinationPath dist/Datum-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Datum-Setup-Windows11
          path: datum/packaging/Output/*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Datum-portable
          path: datum/dist/Datum-portable.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: datum/selftest.txt
          if-no-files-found: ignore
