name: 개굴씨 APK 빌드

on:
  push:
    branches: ['**']
    paths:
      - 'couple-app/**'
      - '!couple-app/**/*.md'
      - '.github/workflows/couple-apk.yml'
    tags: ['couple-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: couple-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: couple-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 확인 (러너에 기본 설치됨)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: 의존성 설치
        run: npm ci

      - name: 안드로이드 프로젝트 생성 + 아이콘
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      - name: 버전 번호 올리기 (빌드마다 versionCode 증가)
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 서명 키 준비 (시크릿이 있으면 release, 없으면 debug)
        id: keys
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드 (debug)
        if: steps.keys.outputs.mode == 'debug'
        working-directory: couple-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gaegul-couple.apk"

      - name: APK 빌드 (release, 고정 키로 서명)
        if: steps.keys.outputs.mode == 'release'
        working-directory: couple-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/gaegul-couple.apk" aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gaegul-couple-apk
          path: gaegul-couple.apk

      - name: GitHub Release에 올리기 (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'couple-latest' }}
          target_commitish: ${{ github.sha }}
          name: 개굴씨 부부연구소 APK
          body: |
            📱 폰에서 아래 **gaegul-couple.apk**를 눌러 받은 뒤 설치하세요.

            **설치가 안 되면**
            1. 이전에 설치한 개굴씨 앱이 있으면 먼저 **삭제** (서명이 달라 덮어쓰기가 안 됨). 삭제 전 도구 → 동기화에서 기록 코드 백업
            2. 갤럭시: 설정 → 보안 및 개인정보 보호 → **자동 차단** 끄기
            3. 처음 한 번: "출처를 알 수 없는 앱 설치" 허용 (내 파일 또는 사용한 브라우저)
            4. Play 프로텍트 경고 → 세부정보 → 무시하고 설치

            빌드 커밋: ${{ github.sha }}
          files: gaegul-couple.apk
          make_latest: true
