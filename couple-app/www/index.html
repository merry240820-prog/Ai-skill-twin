<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC4C74">
<title>해해</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">해해</div>
  <button class="who" id="whoBtn" aria-label="지금 사용하는 사람 바꾸기"></button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" role="tablist">
  <button data-tab="home" class="on"><span class="ico">🏠</span><span>홈</span></button>
  <button data-tab="program"><span class="ico">🌱</span><span>개선과정</span></button>
  <button data-tab="mom"><span class="ico">🤱</span><span>산후케어</span></button>
  <button data-tab="love"><span class="ico">💗</span><span>사랑</span></button>
  <button data-tab="tools"><span class="ico">🧰</span><span>도구</span></button>
</nav>

<button class="fab" id="timeoutFab" aria-label="멈춤 타임 (타임아웃)">✋<span>멈춤 타임</span></button>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" hidden></div>

<script src="js/saju.js"></script>
<script src="js/data.js"></script>
<script src="js/frog.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
