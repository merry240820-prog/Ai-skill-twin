<title>토익스피킹 30일 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F4F6F4;
  --surface:#FFFFFF;
  --surface-2:#E9EEEA;
  --ink:#15211C;
  --ink-2:#4A5A52;
  --ink-3:#7D8C84;
  --line:#D8E0DA;
  --line-2:#C3CEC6;
  --accent:#0B6B53;
  --accent-2:#0E8266;
  --accent-soft:#DDEEE6;
  --on-accent:#FFFFFF;
  --gold:#946713;
  --gold-soft:#F5EAD1;
  --rec:#C42B23;
  --rec-soft:#FAE3E1;
  --shadow:0 1px 2px rgba(21,33,28,.06), 0 8px 24px -14px rgba(21,33,28,.28);
  --r-s:8px; --r-m:12px; --r-l:18px;
  --f-display:'Gabarito','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1513;
    --surface:#17201C;
    --surface-2:#202B26;
    --ink:#E9F0EB;
    --ink-2:#A8BAB0;
    --ink-3:#78897F;
    --line:#2A3832;
    --line-2:#3A4A43;
    --accent:#4FC49F;
    --accent-2:#69D6B3;
    --accent-soft:#17342B;
    --on-accent:#06130F;
    --gold:#DCB35C;
    --gold-soft:#332A14;
    --rec:#F0796D;
    --rec-soft:#3A1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1513;
  --surface:#17201C;
  --surface-2:#202B26;
  --ink:#E9F0EB;
  --ink-2:#A8BAB0;
  --ink-3:#78897F;
  --line:#2A3832;
  --line-2:#3A4A43;
  --accent:#4FC49F;
  --accent-2:#69D6B3;
  --accent-soft:#17342B;
  --on-accent:#06130F;
  --gold:#DCB35C;
  --gold-soft:#332A14;
  --rec:#F0796D;
  --rec-soft:#3A1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; background:var(--paper)}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:10px 16px; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.topbar .mark{
  width:30px; height:30px; flex:none; border-radius:9px; background:var(--accent);
  color:var(--on-accent); display:grid; place-items:center;
  font-family:var(--f-display); font-weight:700; font-size:13px;
}
.topbar h1{font-size:15px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.streak{
  font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--gold);
  background:var(--gold-soft); padding:3px 9px; border-radius:99px; white-space:nowrap;
}
.iconbtn{background:none; border:1px solid var(--line); border-radius:9px; width:32px; height:32px; display:grid; place-items:center; flex:none; color:var(--ink-2)}

main{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
.wrap{padding:16px 16px 28px; display:flex; flex-direction:column; gap:16px}

.tabbar{
  position:sticky; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar button{
  background:none; border:0; padding:5px 2px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-3); font-size:10.5px; font-weight:500; border-radius:10px;
}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar svg{width:21px; height:21px; stroke-width:1.7}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:16px}
.card.flat{border-radius:var(--r-m); padding:14px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.muted{color:var(--ink-2); font-size:13.5px}
.tiny{color:var(--ink-3); font-size:12px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.row{display:flex; align-items:center; gap:10px}
.row.wrap-r{flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.stack{display:flex; flex-direction:column; gap:10px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:-4px}
.sec-h h2{font-size:17px; font-weight:600}

.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:500; line-height:1.2;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn.ghost{border-color:transparent; background:var(--surface-2); color:var(--ink-2)}
.btn.rec{background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600}
.btn.sm{padding:6px 10px; font-size:12.5px; border-radius:8px}
.btn.full{width:100%; text-align:center; padding:12px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.chipbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:500; white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.seg{display:flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:3px}
.seg button{flex:1; border:0; background:none; border-radius:9px; padding:8px 4px; font-size:13px; font-weight:500; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow)}

.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.pill.gold{background:var(--gold-soft); color:var(--gold)}
.pill.rec{background:var(--rec-soft); color:var(--rec)}

.bar{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease}
.bar.gold > i{background:var(--gold)}

input,textarea,select{
  font:inherit; width:100%; background:var(--surface); color:var(--ink);
  border:1px solid var(--line-2); border-radius:10px; padding:10px 12px;
}
textarea{resize:vertical; min-height:70px; line-height:1.55}
label.fld{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--ink-2)}

/* ---------- dashboard ---------- */
.hero{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:18px 16px; box-shadow:var(--shadow);
}
.hero .dayno{font-family:var(--f-mono); font-size:34px; font-weight:600; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 13px}
.tile b{display:block; font-family:var(--f-mono); font-size:22px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px; color:var(--ink-3); font-weight:500}

/* ---------- checklist ---------- */
.task{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{
  appearance:none; width:21px; height:21px; flex:none; margin:1px 0 0; padding:0;
  border:1.7px solid var(--line-2); border-radius:7px; background:var(--surface); position:relative;
}
.task input[type=checkbox]:checked{background:var(--accent); border-color:var(--accent)}
.task input[type=checkbox]:checked::after{
  content:""; position:absolute; left:6.5px; top:2.5px; width:5px; height:10px;
  border:solid var(--on-accent); border-width:0 2.2px 2.2px 0; transform:rotate(43deg);
}
.task .tx{flex:1; min-width:0; font-size:14px; line-height:1.5}
.task input:checked + .tx{color:var(--ink-3); text-decoration:line-through}
.task .min{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); flex:none; padding-top:2px}

.daycard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden}
.daycard > summary{
  list-style:none; cursor:pointer; padding:13px 14px; display:flex; align-items:center; gap:11px;
}
.daycard > summary::-webkit-details-marker{display:none}
.daycard .dnum{
  font-family:var(--f-mono); font-size:12px; font-weight:600; width:38px; flex:none;
  color:var(--ink-3); letter-spacing:-.02em;
}
.daycard .dttl{flex:1; min-width:0; font-size:13.5px; font-weight:500; line-height:1.4}
.daycard .dprog{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); flex:none}
.daycard[data-done="1"] .dnum{color:var(--accent)}
.daycard[data-today="1"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.daycard .body{padding:0 14px 14px; border-top:1px solid var(--line); margin-top:2px}

/* ---------- memo bank ---------- */
.tmpl{
  background:var(--surface-2); border-radius:var(--r-m); padding:12px 13px;
  font-size:13.5px; line-height:1.7; border-left:3px solid var(--accent);
}
.tmpl .sl{color:var(--gold); font-weight:600}
.exline{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); align-items:flex-start}
.exline:first-child{border-top:0}
.exline .en{font-weight:500; font-size:13.5px; flex:1; min-width:0}
.exline .ko{font-size:12.5px; color:var(--ink-2); flex:1; min-width:0}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m)}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:340px}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{background:var(--surface-2); font-weight:600; font-size:11.5px; color:var(--ink-2); white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ---------- flashcard ---------- */
.fcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:26px 18px; min-height:190px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; text-align:center; box-shadow:var(--shadow);
}
.fcard .front{font-family:var(--f-display); font-size:24px; font-weight:600; line-height:1.3}
.fcard .back{font-size:16px; font-weight:500}
.fcard .ex{font-size:13px; color:var(--ink-2); line-height:1.6; max-width:34em}

/* ---------- recorder ---------- */
.timer{
  font-family:var(--f-mono); font-size:52px; font-weight:600; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em;
}
.phase-prep{color:var(--gold)}
.phase-ans{color:var(--rec)}
.phase-idle{color:var(--ink-3)}
.ringwrap{display:grid; place-items:center; gap:10px; padding:6px 0}
.reclist .rec-it{display:flex; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--line)}
.reclist .rec-it:first-child{border-top:0}
.score-row{display:flex; gap:6px; align-items:center}
.score-row .sbtn{width:28px; height:28px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface); font-family:var(--f-mono); font-size:12px; display:grid; place-items:center}
.score-row .sbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
audio{width:100%; height:34px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- notes ---------- */
.note{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:13px 14px; display:flex; flex-direction:column; gap:8px}
.note .q{font-size:13.5px; font-weight:500; line-height:1.5}
.note .mine{font-size:13px; color:var(--rec); background:var(--rec-soft); border-radius:8px; padding:8px 10px; line-height:1.55}
.note .fix{font-size:13px; color:var(--accent); background:var(--accent-soft); border-radius:8px; padding:8px 10px; line-height:1.55}
.empty{text-align:center; padding:30px 16px; color:var(--ink-3); font-size:13.5px; line-height:1.7}

dialog{
  border:0; padding:0; background:transparent; max-width:520px; width:calc(100% - 24px);
  color:var(--ink);
}
dialog::backdrop{background:rgba(10,18,15,.55); backdrop-filter:blur(2px)}
dialog .sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:18px; display:flex; flex-direction:column; gap:12px; max-height:82vh; overflow-y:auto}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:99px; font-size:13px; font-weight:500;
  z-index:60; box-shadow:var(--shadow); max-width:calc(100% - 32px); text-align:center;
}
</style>

<div class="app">
  <header class="topbar">
    <div class="mark">TS</div>
    <h1>토익스피킹 30일 트레이너</h1>
    <span class="streak mono" id="streakPill">0일 연속</span>
    <button class="iconbtn" id="settingsBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="17" height="17" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main"><div class="wrap" id="view"></div></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>홈</button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="m8.5 14.5 2 2 4-4"/></svg>플랜</button>
    <button data-tab="bank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4.5h6a3 3 0 0 1 3 3V21a2.4 2.4 0 0 0-2.4-2.4H4z"/><path d="M20 4.5h-6a3 3 0 0 0-3 3V21a2.4 2.4 0 0 1 2.4-2.4H20z"/></svg>암기집</button>
    <button data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3.5h10l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20z"/><path d="M14.5 3.5V8H19"/><path d="M8.5 13h7M8.5 17h5"/></svg>노트</button>
    <button data-tab="rec">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/></svg>녹음</button>
  </nav>
</div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
/* =========================================================
   토익스피킹 30일 트레이너 — 데이터
   시험 구성: 11문항 / 약 20분 / 0~200점 / Level 1~8
   ========================================================= */

const PLAN = [
 {d:1,w:1,t:'진단 테스트 & 시험 구조',goal:'내 현재 위치와 시험의 시간 규칙을 몸에 새긴다',tasks:[['11문항 구성과 준비/답변 시간표 외우기',10],['[녹음] 진단 테스트: Q1~Q11 전체 1회전',25],['녹음 다시 듣고 약점 3가지를 오답노트에 기록',10]]},
 {d:2,w:1,t:'Q1-2 읽기의 기본',goal:'끊어읽기와 강세 규칙을 적용해 본다',tasks:[['암기집 Q1-2 채점 포인트·끊어읽기 규칙 정독',10],['내용어 강세 + 연음 10세트 소리내어 연습',15],['[녹음] 지문 2개 × 2회, 두 번째가 나아졌는지 비교',15]]},
 {d:3,w:1,t:'Q1-2 숫자와 고유명사',goal:'숫자에서 멈추지 않는다',tasks:[['날짜·시간·전화번호·금액·퍼센트 읽는 법 암기',12],['단어장 「Q1-2 읽기」 카드 1회전',10],['[녹음] 지문 2개, 숫자 정확도만 자가채점',15]]},

/* =========================================================
   상태 저장 — localStorage(진행/노트) + IndexedDB(녹음 오디오)
   모든 데이터는 이 기기 안에만 저장됩니다.
   ========================================================= */
const LS_KEY='tsp30.v1';
const BLANK={start:null,tasks:{},vocab:{},notes:[],log:{},theme:null,tab:'home'};
let S=(function(){try{const r=localStorage.getItem(LS_KEY);if(r)return Object.assign({},BLANK,JSON.parse(r));}catch(e){}return JSON.parse(JSON.stringify(BLANK));})();
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

let RECS=[];               // {id,ts,part,label,q,dur,blob,scores,memo}
let IDB_OK=true, _db=null;
function idb(){return new Promise((res,rej)=>{if(_db)return res(_db);let rq;try{rq=indexedDB.open('tsp30',1);}catch(e){return rej(e);}
 rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('recs'))d.createObjectStore('recs',{keyPath:'id'});};
 rq.onsuccess=()=>{_db=rq.result;res(_db);};rq.onerror=()=>rej(rq.error);});}
async function idbAll(){try{const d=await idb();return await new Promise((res,rej)=>{const r=d.transaction('recs').objectStore('recs').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}catch(e){IDB_OK=false;return[];}}
async function idbPut(o){try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction('recs','readwrite');t.objectStore('recs').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){IDB_OK=false;}}
async function idbDel(id){try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction('recs','readwrite');t.objectStore('recs').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){IDB_OK=false;}}

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const view=()=>$('#view');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayKey(d){const t=d||new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function dayDiff(aKey,bKey){const a=new Date(aKey+'T00:00:00'),b=new Date(bKey+'T00:00:00');return Math.round((b-a)/86400000);}
function addDays(k,n){const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return todayKey(d);}
function mmss(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0');}
let _toastT=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(_toastT);_toastT=setTimeout(()=>{t.hidden=true;},2200);}
function sheet(html){const d=$('#sheet');$('#sheetBody').innerHTML=html;if(!d.open)d.showModal();}
function closeSheet(){const d=$('#sheet');if(d.open)d.close();}

/* ---------- 진행 통계 ---------- */
const TOTAL_TASKS=PLAN.reduce((n,d)=>n+d.tasks.length,0);
function taskKey(d,i){return 'd'+d+'-'+i;}
function dayDone(d){const p=PLAN[d-1];return p.tasks.every((_,i)=>S.tasks[taskKey(d,i)]);}
function dayCount(d){const p=PLAN[d-1];return p.tasks.filter((_,i)=>S.tasks[taskKey(d,i)]).length;}
function doneTasks(){return Object.values(S.tasks).filter(Boolean).length;}
function doneDays(){let n=0;for(let d=1;d<=30;d++)if(dayDone(d))n++;return n;}
function currentDay(){
  for(let d=1;d<=30;d++)if(!dayDone(d))return d;   // 아직 끝내지 않은 첫 Day
  return 30;
}
function scheduledDay(){return S.start?Math.min(30,Math.max(1,dayDiff(S.start,todayKey())+1)):1;}
function streak(){
  let n=0,k=todayKey();
  if(!S.log[k])k=addDays(k,-1);
  while(S.log[k]){n++;k=addDays(k,-1);}
  return n;
}
function markLog(){const k=todayKey();S.log[k]=(S.log[k]||0)+1;}
function vocabState(id){return S.vocab[id]||{b:0,n:0,w:0};}
function vocabDue(list){const now=Date.now();return (list||VOCAB).filter(v=>{const st=vocabState(v.id);return st.b===0||st.n<=now;});}
function vocabLearned(){return VOCAB.filter(v=>vocabState(v.id).b>=3).length;}
function openNotes(){return S.notes.filter(n=>!n.done).length;}
function recSeconds(){return RECS.reduce((n,r)=>n+(r.dur||0),0);}

/* =========================================================
   라우팅
   ========================================================= */
const VIEWS={};
let TAB=S.tab&&['home','plan','bank','notes','rec'].includes(S.tab)?S.tab:'home';
function go(tab,opts){
  if(RUN.active&&tab!=='rec'){if(!confirm('진행 중인 녹음 세션을 중단할까요?'))return;stopRun(true);}
  TAB=tab;S.tab=tab;save();
  document.querySelectorAll('#tabbar button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  render(opts);
  $('#main').scrollTop=0;
}
function render(opts){
  view().innerHTML=VIEWS[TAB](opts||{});
  $('#streakPill').textContent=streak()+'일 연속';
}

      '<button class="btn primary full" data-act="startPlan">오늘부터 Day 1 시작</button>'+

        '<div><span class="eyebrow">오늘의 학습</span>'+
          '<div class="row" style="gap:8px;align-items:baseline"><span class="dayno">'+cd+'</span><span class="muted" style="font-weight:600">/ 30일</span></div>'+
          '<h2 style="font-size:17px;margin-top:4px">'+esc(p.t)+'</h2>'+
          '<p class="muted" style="margin-top:3px">'+esc(p.goal)+'</p></div>'+
        '<span class="pill '+(behind?'gold':'accent')+'">'+(behind?'일정보다 '+behind+'일 밀림':'일정대로')+'</span>'+
      '</div>'+
      '<div style="margin-top:14px">'+p.tasks.map((t,i)=>{
        const k=taskKey(cd,i),ck=!!S.tasks[k];
        return '<label class="task"><input type="checkbox" data-act="task" data-k="'+k+'"'+(ck?' checked':'')+'><span class="tx">'+esc(t[0])+'</span><span class="min mono">'+t[1]+'분</span></label>';
      }).join('')+'</div>'+
    '</div>';
  }

  out+='<div class="tiles">'+
    tile(pct+'%','전체 진행률')+
    tile(doneDays()+'일','완주한 Day')+
    tile(String(RECS.length),'녹음 '+(recSeconds()?'· '+mmss(recSeconds()):''))+
    tile(vocabLearned()+'/'+VOCAB.length,'암기한 표현')+
  '</div>';

  out+='<div class="card stack">'+
    '<div class="spread"><span class="eyebrow">오늘 할 일</span></div>'+
    row2('오늘 복습할 표현', due+'개', due?'notes:vocab':'', due?'복습 시작':'모두 완료')+
    row2('미해결 오답노트', on+'개', on?'notes:wrong':'', on?'확인':'비어 있음')+
    row2('실전 녹음 연습', '5개 파트', 'rec', '바로 가기')+
  '</div>';

  out+='<div class="sec-h"><h2>주차별 진행</h2><span class="tiny mono">'+doneTasks()+' / '+TOTAL_TASKS+' 과제</span></div>';
  out+='<div class="stack">'+WEEKS.map(w=>{
    const days=PLAN.filter(d=>d.w===w.w);
    const tot=days.reduce((n,d)=>n+d.tasks.length,0);
    const dn=days.reduce((n,d)=>n+dayCount(d.d),0);
    const q=Math.round(dn/tot*100);
    return '<div class="card flat stack" style="gap:8px">'+
      '<div class="spread"><b style="font-size:14px;font-weight:600">'+esc(w.t)+'</b><span class="tiny mono">'+q+'%</span></div>'+
      '<p class="tiny">'+esc(w.s)+'</p>'+
      '<div class="bar"><i style="width:'+q+'%"></i></div></div>';
  }).join('')+'</div>';

  out+='<div class="card flat stack" style="gap:8px">'+
    '<span class="eyebrow">시험 한눈에</span>'+
    EXAM_FACTS.map(f=>'<div class="spread" style="gap:14px"><span class="tiny" style="flex:none;font-weight:600;color:var(--ink-2)">'+esc(f[0])+'</span><span class="tiny mono" style="text-align:right">'+esc(f[1])+'</span></div>').join('')+
  '</div>';
  return out;
};
function tile(b,s){return '<div class="tile"><b>'+esc(b)+'</b><span>'+esc(s)+'</span></div>';}
function row2(label,val,dest,cta){
  return '<div class="spread" style="border-top:1px solid var(--line);padding-top:10px">'+
    '<div><div style="font-size:13.5px;font-weight:500">'+esc(label)+'</div><div class="tiny mono">'+esc(val)+'</div></div>'+
    (dest?'<button class="btn sm" data-act="goto" data-dest="'+dest+'">'+esc(cta)+'</button>':'<span class="tiny">'+esc(cta)+'</span>')+'</div>';
}

  const cd=currentDay();
  let out='<div class="sec-h"><h2>30일 플랜</h2><span class="tiny mono">'+doneDays()+'/30일 완주</span></div>';
  if(!S.start){
    out+='<div class="card stack"><p class="muted">아직 시작일이 없습니다. 오늘을 Day 1로 시작하면 진행률과 연속 학습일이 기록됩니다.</p><button class="btn primary full" data-act="startPlan">오늘부터 시작</button></div>';
  }else{
    out+='<div class="card flat spread"><div><div class="tiny">시작일</div><div class="mono" style="font-weight:600">'+S.start+'</div></div><button class="btn sm ghost" data-act="resetStart">시작일 변경</button></div>';
  }
  WEEKS.forEach(w=>{
    out+='<div class="sec-h" style="margin-top:6px"><h2 style="font-size:15px">'+esc(w.t)+'</h2></div>';
    out+='<div class="stack" style="gap:8px">';
    PLAN.filter(d=>d.w===w.w).forEach(d=>{
      const c=dayCount(d.d),n=d.tasks.length,done=c===n;
      out+='<details class="daycard" data-done="'+(done?1:0)+'" data-today="'+(d.d===cd?1:0)+'"'+(d.d===cd?' open':'')+'>'+
        '<summary><span class="dnum">DAY '+String(d.d).padStart(2,'0')+'</span>'+
        '<span class="dttl">'+esc(d.t)+'</span>'+
        '<span class="dprog mono">'+(done?'완료':c+'/'+n)+'</span></summary>'+
        '<div class="body"><p class="tiny" style="padding:10px 0 2px">'+esc(d.goal)+'</p>'+
        d.tasks.map((t,i)=>{const k=taskKey(d.d,i);
          return '<label class="task"><input type="checkbox" data-act="task" data-k="'+k+'"'+(S.tasks[k]?' checked':'')+'><span class="tx">'+esc(t[0])+'</span><span class="min mono">'+t[1]+'분</span></label>';
        }).join('')+
        '<div class="row" style="margin-top:10px;gap:8px"><button class="btn sm ghost" data-act="dayAll" data-d="'+d.d+'">'+(done?'전체 해제':'전체 완료')+'</button>'+
        '<span class="tiny mono">예상 '+d.tasks.reduce((n2,t)=>n2+t[1],0)+'분</span></div>'+
      '</div></details>';
    });
    out+='</div>';
  });
  return out;
};

/* ---------- 엔진 ---------- */
let AC=null;
function beep(freq,ms){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+ms/1000);
    o.start();o.stop(AC.currentTime+ms/1000+.02);}catch(e){}
}
function pickMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus',''];
  for(const m of c){try{if(!m||MediaRecorder.isTypeSupported(m))return m;}catch(e){}}
  return '';
}
async function startRun(items,title){
  if(!items||!items.length)return;
  RUN.items=items;RUN.i=0;RUN.title=title||'';RUN.saved=[];RUN.active=true;RUN.noMic=false;
  try{
    if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error('unsupported');
    RUN.stream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    RUN.noMic=true;
    if(!confirm('마이크를 사용할 수 없습니다.\n타이머만 켜고 연습을 계속할까요?')){RUN.active=false;render();return;}
  }
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}
  enterItem();
}
function enterItem(){
  const it=RUN.items[RUN.i];
  if(!it){finishRun();return;}
  if(it.preSec){setPhase('pre',it.preSec);}else{setPhase('prep',it.prep);}
  render();
}
function setPhase(p,sec){
  RUN.phase=p;RUN.left=sec;
  clearInterval(RUN.t);
  RUN.t=setInterval(tick,1000);
}
function tick(){
  RUN.left--;
  const el=document.getElementById('runTimer');
  if(el)el.textContent=mmss(Math.max(0,RUN.left));
  if(RUN.left===3&&RUN.phase!=='ans')beep(760,90);
  if(RUN.left<=0){
    clearInterval(RUN.t);
    if(RUN.phase==='pre'){setPhase('prep',RUN.items[RUN.i].prep);render();}
    else if(RUN.phase==='prep'){beep(940,220);beginAnswer();}
    else if(RUN.phase==='ans'){beep(520,260);endAnswer();}
  }
}
function beginAnswer(){
  const it=RUN.items[RUN.i];
  RUN.chunks=[];
  if(RUN.stream&&!RUN.noMic){
    try{
      const mt=pickMime();
      RUN.mr=mt?new MediaRecorder(RUN.stream,{mimeType:mt}):new MediaRecorder(RUN.stream);
      RUN.mr.ondataavailable=e=>{if(e.data&&e.data.size)RUN.chunks.push(e.data);};
      RUN.mr.onstop=()=>persist(it);
      RUN.mr.start();
    }catch(e){RUN.noMic=true;}
  }
  RUN.startedAt=Date.now();
  setPhase('ans',it.ans);
  render();
}
function endAnswer(){
  if(RUN.mr&&RUN.mr.state==='recording'){RUN.mr.stop();RUN.mr=null;}
  else advance();
}
async function persist(it){
  const dur=Math.max(1,Math.round((Date.now()-RUN.startedAt)/1000));
  const blob=new Blob(RUN.chunks,{type:(RUN.chunks[0]&&RUN.chunks[0].type)||'audio/webm'});
  const rec={id:'rc'+Date.now()+Math.floor(Math.random()*999),ts:Date.now(),part:it.part,label:it.label,dur:dur,blob:blob,scores:{},memo:''};
  RECS.push(rec);RUN.saved.push(rec.id);
  await idbPut(rec);
  markLog();save();
  advance();
}
function advance(){RUN.i++;if(RUN.i>=RUN.items.length)finishRun();else enterItem();}
function finishRun(){clearInterval(RUN.t);try{if(RUN.stream)RUN.stream.getTracks().forEach(tr=>tr.stop());}catch(e){}RUN.stream=null;RUN.phase='done';render();}
function stopRun(silent){
  clearInterval(RUN.t);
  try{if(RUN.mr&&RUN.mr.state==='recording'){RUN.mr.onstop=null;RUN.mr.stop();}}catch(e){}
  RUN.mr=null;
  try{if(RUN.stream)RUN.stream.getTracks().forEach(t=>t.stop());}catch(e){}
  RUN.stream=null;RUN.active=false;RUN.phase='idle';
  if(!silent)render();
}

/* =========================================================
   플래시카드 로직
   ========================================================= */
function fcStart(mode){
  const base=vgList();
  const q=(mode==='due'?vocabDue(base):base.slice()).sort(()=>Math.random()-.5);
  FC.q=q;FC.i=0;FC.flip=false;FC.on=q.length>0;
  if(!q.length)toast('학습할 카드가 없습니다');
  render();
}
function fcAnswer(ok){
  const v=FC.q[FC.i];if(!v)return;
  const st=Object.assign({b:0,n:0,w:0},S.vocab[v.id]);
  if(ok){st.b=Math.min(6,st.b+1);st.n=Date.now()+SRS[st.b]*86400000;}
  else{st.w++;st.b=0;st.n=Date.now();}
  S.vocab[v.id]=st;markLog();save();
  FC.i++;FC.flip=false;
  if(FC.i>=FC.q.length){FC.on=false;toast('카드 '+FC.q.length+'개 학습 완료');}
  render();
}

   설정 · 백업
   ========================================================= */
function applyTheme(){
  if(S.theme)document.documentElement.dataset.theme=S.theme;
  else delete document.documentElement.dataset.theme;
}
function settingsSheet(){
  const th=S.theme||'system';
  sheet('<h3 style="font-size:17px">설정</h3>'+
   '<div class="fld">화면 테마<div class="seg">'+
     [['system','시스템'],['light','라이트'],['dark','다크']].map(t=>'<button data-act="theme" data-t="'+t[0]+'" aria-pressed="'+(th===t[0])+'">'+t[1]+'</button>').join('')+'</div></div>'+
   '<div class="card flat stack" style="gap:6px"><span class="eyebrow">홈 화면에 추가</span>'+
     '<p class="tiny">iPhone Safari: 공유 버튼 → «홈 화면에 추가».<br>Android Chrome: 우측 상단 ⋮ → «홈 화면에 추가».<br>추가하면 앱 아이콘으로 바로 열리고, 학습 기록은 그대로 유지됩니다.</p></div>'+
   '<div class="card flat stack" style="gap:6px"><span class="eyebrow">데이터 저장 위치</span>'+
     '<p class="tiny">진행·단어·오답노트는 이 브라우저에, 녹음 파일은 기기 내부 저장소에만 보관됩니다. 서버로 전송되지 않습니다. 브라우저 데이터를 지우면 함께 사라지니 가끔 백업하세요.</p></div>'+
   '<div class="row" style="gap:8px"><button class="btn full" data-act="backup">백업 만들기</button><button class="btn full" data-act="restore">백업 복원</button></div>'+
   '<button class="btn full" data-act="wipe" style="color:var(--rec);border-color:var(--rec)">모든 기록 초기화</button>'+
   '<button class="btn ghost full" data-act="sheetClose">닫기</button>');
}
function backupSheet(){
  const data=JSON.stringify({v:1,exportedAt:new Date().toISOString(),state:S},null,1);
  sheet('<h3 style="font-size:17px">백업 만들기</h3>'+
    '<p class="tiny">아래 내용을 통째로 복사해 메모앱이나 메일에 보관하세요. 녹음 오디오는 용량이 커서 포함되지 않습니다.</p>'+
    '<textarea id="bkOut" readonly style="min-height:170px;font-family:var(--f-mono);font-size:11px">'+esc(data)+'</textarea>'+
    '<div class="row" style="gap:8px"><button class="btn primary full" data-act="bkCopy">복사하기</button><button class="btn full" data-act="sheetClose">닫기</button></div>');
}
function restoreSheet(){
  sheet('<h3 style="font-size:17px">백업 복원</h3>'+
    '<p class="tiny">백업 내용을 붙여넣으면 현재 기록을 덮어씁니다.</p>'+
    '<textarea id="rsIn" placeholder=\'{"v":1,...}\' style="min-height:170px;font-family:var(--f-mono);font-size:11px"></textarea>'+
    '<div class="row" style="gap:8px"><button class="btn full" data-act="sheetClose">취소</button><button class="btn primary full" data-act="rsGo">복원하기</button></div>');
}
function copyText(t,msg){
  const done=()=>toast(msg||'복사했습니다');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}
  else fallback();
  function fallback(){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}
    catch(e){toast('복사에 실패했습니다. 직접 선택해 주세요');}
  }
}

/* =========================================================
   이벤트
   ========================================================= */
let TAG_BUF=[];
document.addEventListener('click',async function(e){
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const a=t.dataset.act;

  if(a==='goto'){const d=t.dataset.dest.split(':');if(d[1])NOTE_MODE=d[1]==='vocab'?'vocab':'wrong';go(d[0]);return;}
  if(a==='startPlan'){S.start=todayKey();markLog();save();render();toast('Day 1 시작. 오늘 할 일이 준비됐어요');return;}
  if(a==='resetStart'){const v=prompt('시작일을 YYYY-MM-DD 로 입력하세요',S.start||todayKey());
    if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){S.start=v;save();render();toast('시작일을 바꿨습니다');}return;}
  if(a==='dayAll'){const d=+t.dataset.d,p=PLAN[d-1],all=dayDone(d);
    p.tasks.forEach((_,i)=>{if(all)delete S.tasks[taskKey(d,i)];else S.tasks[taskKey(d,i)]=true;});
    if(!all)markLog();save();render();return;}

  if(a==='bankSel'){BANK_SEL=t.dataset.id;render();$('#main').scrollTop=0;return;}
  if(a==='copyTmpl'){const b=BANK.find(x=>x.id===BANK_SEL);const g=b.tmpl.find(x=>x.h===t.dataset.h);
    if(g)copyText(g.h+'\n'+g.lines.join('\n'),'템플릿을 복사했습니다');return;}

  if(a==='noteMode'){NOTE_MODE=t.dataset.m;render();return;}
  if(a==='vg'){VG_SEL=+t.dataset.g;FC.on=false;render();return;}
  if(a==='fcStart'){fcStart(t.dataset.mode);return;}
  if(a==='flip'){FC.flip=!FC.flip;render();return;}
  if(a==='fcYes'){fcAnswer(true);return;}
  if(a==='fcNo'){fcAnswer(false);return;}
  if(a==='fcEnd'){FC.on=false;render();return;}
  if(a==='fcToNote'){const v=FC.q[FC.i];TAG_BUF=['어휘'];
    sheet(noteForm({id:'',part:'기타',q:'표현: '+v.en+' ('+v.ko+')',mine:'',fix:v.ex,tags:['어휘']}));return;}

  if(a==='nf'){NF=t.dataset.f;render();return;}
  if(a==='noteNew'){TAG_BUF=[];sheet(noteForm(null));return;}
  if(a==='noteEdit'){const n=S.notes.find(x=>x.id===t.dataset.id);if(n){TAG_BUF=(n.tags||[]).slice();sheet(noteForm(n));}return;}
  if(a==='tagTog'){const tag=t.dataset.t,on=t.getAttribute('aria-pressed')==='true';
    t.setAttribute('aria-pressed',String(!on));
    if(on)TAG_BUF=TAG_BUF.filter(x=>x!==tag);else if(!TAG_BUF.includes(tag))TAG_BUF.push(tag);return;}
  if(a==='noteSave'){
    const q=$('#nfQ').value.trim();
    if(!q){toast('문제나 상황을 적어주세요');return;}
    const id=t.dataset.id;
    const body={part:$('#nfPart').value,q:q,mine:$('#nfMine').value.trim(),fix:$('#nfFix').value.trim(),tags:TAG_BUF.slice()};
    if(id){const n=S.notes.find(x=>x.id===id);Object.assign(n,body);}
    else S.notes.push(Object.assign({id:'n'+Date.now(),ts:Date.now(),done:false},body));
    markLog();save();closeSheet();NOTE_MODE='wrong';render();toast('오답노트에 저장했습니다');return;}
  if(a==='noteDone'){const n=S.notes.find(x=>x.id===t.dataset.id);n.done=!n.done;save();render();return;}
  if(a==='noteDel'){if(confirm('이 오답 기록을 삭제할까요?')){S.notes=S.notes.filter(x=>x.id!==t.dataset.id);save();render();}return;}
  if(a==='sheetClose'){closeSheet();return;}

  if(a==='recSel'){REC_SEL=t.dataset.k;render();return;}
  if(a==='runOne'){await startRun(buildItems(t.dataset.k,t.dataset.id),PART_SPECS[t.dataset.k].part);return;}
  if(a==='runMock'){await startRun(buildMock(),'모의고사');return;}
  if(a==='runSkip'){clearInterval(RUN.t);if(RUN.phase==='pre'){setPhase('prep',RUN.items[RUN.i].prep);render();}else{beep(940,200);beginAnswer();}return;}
  if(a==='runStop'){clearInterval(RUN.t);beep(520,220);endAnswer();return;}
  if(a==='runAbort'){if(confirm('세션을 중단할까요? 지금까지 저장된 녹음은 남습니다.'))stopRun();return;}
  if(a==='runExit'){stopRun();return;}

  if(a==='recPlay'){
    const box=document.querySelector('[data-player="'+t.dataset.id+'"]');
    const r=RECS.find(x=>x.id===t.dataset.id);
    if(!box||!r)return;
    if(!box.hidden){box.hidden=true;box.innerHTML='';t.textContent='재생';return;}
    const au=document.createElement('audio');au.controls=true;au.src=URL.createObjectURL(r.blob);
    box.innerHTML='';box.appendChild(au);box.hidden=false;t.textContent='닫기';au.play().catch(()=>{});return;}
  if(a==='score'){
    const r=RECS.find(x=>x.id===t.dataset.id);if(!r)return;
    r.scores=r.scores||{};const ax=t.dataset.ax,n=+t.dataset.n;
    r.scores[ax]=r.scores[ax]===n?0:n;
    await idbPut(r);
    document.querySelectorAll('[data-act="score"][data-id="'+r.id+'"][data-ax="'+ax+'"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===r.scores[ax])));
    return;}
  if(a==='recToNote'){const r=RECS.find(x=>x.id===t.dataset.id);if(!r)return;
    TAG_BUF=[];NOTE_MODE='wrong';
    sheet(noteForm({id:'',part:r.part,q:r.label+' — 녹음 '+new Date(r.ts).toLocaleDateString('ko-KR'),mine:'',fix:'',tags:[]}));return;}
  if(a==='recDel'){if(confirm('이 녹음을 삭제할까요?')){await idbDel(t.dataset.id);RECS=RECS.filter(x=>x.id!==t.dataset.id);render();}return;}
  if(a==='recClear'){if(confirm('녹음을 모두 삭제할까요? 되돌릴 수 없습니다.')){for(const r of RECS)await idbDel(r.id);RECS=[];render();}return;}

  if(a==='theme'){S.theme=t.dataset.t==='system'?null:t.dataset.t;save();applyTheme();settingsSheet();return;}
  if(a==='backup'){backupSheet();return;}
  if(a==='bkCopy'){copyText($('#bkOut').value,'백업 내용을 복사했습니다');return;}
  if(a==='restore'){restoreSheet();return;}
  if(a==='rsGo'){
    try{const o=JSON.parse($('#rsIn').value);const st=o.state||o;
      if(!st||typeof st!=='object')throw 0;
      S=Object.assign({},BLANK,st);save();applyTheme();closeSheet();render();toast('복원했습니다');}
    catch(err){toast('형식이 올바르지 않습니다');}
    return;}
  if(a==='wipe'){
    if(!confirm('진행·단어·오답노트·녹음을 모두 지웁니다. 계속할까요?'))return;
    for(const r of RECS)await idbDel(r.id);RECS=[];
    S=JSON.parse(JSON.stringify(BLANK));save();applyTheme();closeSheet();render();toast('초기화했습니다');return;}
});

document.addEventListener('change',function(e){
  const t=e.target.closest('[data-act="task"]');
  if(!t)return;
  if(t.checked){S.tasks[t.dataset.k]=true;markLog();}else delete S.tasks[t.dataset.k];
  save();
  $('#streakPill').textContent=streak()+'일 연속';
  if(TAB==='home'){render();return;}            // 홈에서는 진행률 타일까지 함께 갱신
  const card=t.closest('.daycard');
  if(card){const d=+t.dataset.k.split('-')[0].slice(1);
    const c=dayCount(d),n=PLAN[d-1].tasks.length;
    card.dataset.done=c===n?1:0;
    card.querySelector('.dprog').textContent=c===n?'완료':c+'/'+n;}
});

$('#tabbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab);});
$('#settingsBtn').addEventListener('click',settingsSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
window.addEventListener('beforeunload',e=>{if(RUN.active){e.preventDefault();e.returnValue='';}});

/* ---------- 시작 ---------- */
applyTheme();
document.querySelectorAll('#tabbar button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===TAB)));
render();
idbAll().then(rs=>{RECS=rs||[];if(RECS.length)render();});
</script>
